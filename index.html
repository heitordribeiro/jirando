<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-55TB9CGJ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());
    </script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jirando</title>
    <script>
        (function redirectByLanguage() {
            const lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
            const target = lang.startsWith("pt") ? "pt-br.html" : lang.startsWith("es") ? "es-es.html" : "en-us.html";
            window.location.replace(target);
        })();
    </script>
    <noscript>
    <meta http-equiv="refresh" content="0; url=en-us.html">
  </noscript>
</head>
